<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Playfair+Display:wght@700&amp;display=swap');
      
      .text-small { 
        font-family: 'Cinzel', 'Times New Roman', serif; 
        font-size: 16px; 
        font-weight: 600; 
        fill: url(#goldGradient); 
        letter-spacing: 7px; 
      }
      
      .text-large { 
        font-family: 'Playfair Display', 'Didot', 'Georgia', serif; 
        font-size: 62px; 
        font-weight: 700; 
        fill: url(#greenGradient); 
        stroke: url(#goldGradient);
        stroke-width: 1.5px;
        letter-spacing: 4px;
        filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.4));
      }
    </style>

    <!-- Ultra Premium Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59348" />
      <stop offset="20%" stop-color="#E2B968" />
      <stop offset="40%" stop-color="#FDF1A9" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Deep Luxury Forest Green Gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163A24" />
      <stop offset="50%" stop-color="#0F291A" />
      <stop offset="100%" stop-color="#050C07" />
    </linearGradient>

    <filter id="premiumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#premiumGlow)">
    <!-- Ground Curve -->
    <path fill="url(#greenGradient)" stroke="url(#goldGradient)" stroke-width="2" d="M 15 156 Q 115 132 235 154 Q 115 146 15 156 Z" />

    <!-- Tall Tree (Right) -->
    <rect fill="url(#greenGradient)" stroke="url(#goldGradient)" stroke-width="1.5" x="111" y="145" width="4" height="12" />
    <path fill="url(#greenGradient)" stroke="url(#goldGradient)" stroke-width="2" stroke-linejoin="round" d="M 113 36 L 128 80 L 118 80 L 138 115 L 126 115 L 148 145 L 78 145 L 100 115 L 88 115 L 108 80 L 98 80 Z" />

    <!-- Short Tree (Left) -->
    <rect fill="url(#greenGradient)" stroke="url(#goldGradient)" stroke-width="1.5" x="74" y="148" width="3" height="10" />
    <path fill="url(#greenGradient)" stroke="url(#goldGradient)" stroke-width="2" stroke-linejoin="round" d="M 75 66 L 87 100 L 79 100 L 94 125 L 85 125 L 102 148 L 48 148 L 65 125 L 56 125 L 71 100 L 63 100 Z" />
  </g>

  <!-- House Roof -->
  <path stroke="url(#goldGradient)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none" filter="url(#goldGlow)" d="M 132 98 L 165 72 L 225 118" />

  <!-- Window Panes -->
  <g fill="url(#goldGradient)" filter="url(#goldGlow)">
    <rect x="156" y="104" width="6" height="6" rx="1.5" />
    <rect x="164" y="104" width="6" height="6" rx="1.5" />
    <rect x="156" y="112" width="6" height="6" rx="1.5" />
    <rect x="164" y="112" width="6" height="6" rx="1.5" />
  </g>

  <!-- Text -->
  <text class="text-small" x="245" y="82">AGENCE IMMOBILIERE</text>
  <text class="text-large" x="245" y="138">LA FORÊT</text>

  <!-- Gold Underlines -->
  <line stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" x1="245" y1="152" x2="285" y2="152" />
  <line stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" x1="535" y1="152" x2="575" y2="152" />
</svg>
